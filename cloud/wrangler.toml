# Your own OnlyOne coordination plane on Cloudflare's free plan.
# Deployed independently by `bun run deploy:cloud`; executors only connect to it.
name = "onlyone"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# Secrets are uploaded atomically with each version by cloud/deploy.ts:
# ONLYONE_TOKEN, ONLYONE_INSTANCE, ONLYONE_OWNER_EMAIL, ONLYONE_RESEND_API_KEY, ONLYONE_MAIL_FROM, ONLYONE_VAPID_*

[assets]
binding = "ASSETS"
directory = "../app/dist/web/onlyone"
not_found_handling = "single-page-application"
run_worker_first = ["/*.wasm", "/*.js", "/*.mjs", "/*.css", "/api/*", "/media/*", "/mcp", "/oauth/*", "/.well-known/*"]

[[durable_objects.bindings]]
name = "ONLYONE"
class_name = "OnlyOne"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OnlyOne"]
