name: npm CLI
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - npm/**
      - src/**
      - cloud/src/**
      - scripts/package-npm.ts
      - scripts/publish-npm.ts
      - test/publish-npm.test.ts
      - scripts/test-npm-install.mjs
      - scripts/test-npm-service.mjs
      - test/npm-*.test.ts
      - test/cli-app.test.ts
      - test/executor-command.test.ts
      - app/executor-command.ts
      - .github/workflows/npm.yml
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Resume publishing the verified artifacts from a tag-triggered npm run'
        type: string
        required: false
permissions:
  contents: read
jobs:
  package:
    if: inputs.resume_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: win32-x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test test/npm-setup.test.ts test/npm-runtime.test.ts test/cli-app.test.ts test/executor-command.test.ts
      - name: Build native package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=0.1.3
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          bun scripts/package-npm.ts "$version" dist/npm "$PLATFORM"
      - run: node scripts/test-npm-install.mjs dist/npm
      - run: node scripts/test-npm-service.mjs dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: dist/npm/
          if-no-files-found: error
  publish:
    if: always() && ((github.event_name == 'push' && github.ref_type == 'tag' && needs.package.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.resume_run != ''))
    needs: package
    runs-on: ubuntu-24.04
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Validate resumed publication source
        if: inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          [[ "$RESUME_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN" > "$RUNNER_TEMP/source-run.json"
          jq -e '.event == "push" and .path == ".github/workflows/npm.yml" and (.head_branch | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))' "$RUNNER_TEMP/source-run.json"
          ref=$(jq -r .head_branch "$RUNNER_TEMP/source-run.json")
          sha=$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)" = "$sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN/jobs" --jq '[.jobs[] | select((.name | startswith("package (")) and .conclusion == "success")] | length')" = 5
          echo "EXPECTED_NPM_VERSION=${ref#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: dist/npm
          merge-multiple: true
          run-id: ${{ inputs.resume_run || github.run_id }}
          github-token: ${{ github.token }}
      # Each package trusts goodchengwang/OnlyOne's npm.yml through OIDC; no npm token is used.
      - name: Check trusted-publishing prerequisites before publishing any package
        run: |
          for package in dist/npm/onlyone-* dist/npm/onlyonecli; do
            name=$(node -p "require('./$package/package.json').name")
            if ! npm view "$name" name --registry=https://registry.npmjs.org; then
              echo "::error::Cannot read $name from npm. Complete its first publication and configure its trusted publisher for goodchengwang/OnlyOne, npm.yml before retrying."
              exit 1
            fi
          done
      - name: Publish platform packages, then the main package
        run: bun scripts/publish-npm.ts dist/npm
