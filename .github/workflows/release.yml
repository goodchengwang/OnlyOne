# Packages the client apps. A tag `vX.Y.Z` publishes them as a GitHub release; pull requests touching this and
# running it by hand only build them (workflow artifacts). Asset names carry no version, so
# `releases/latest/download/<asset>`, used by src/webclient.ts, always resolves.
name: release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup-nsh/**
      - app/nsh.json
      - app/executor.ts
      - app/executor-command.ts
      - scripts/check-app-release.ts
      - scripts/check-published-cli.ts
      - scripts/check-ios-sdk.sh
      - app/build-web.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # NSH main with OTA updates through signed packages (longbridge/nsh#1189), the Android bindgen fix for NDK 27, and
  # checkForUpdate leaving the whole app alone while a package of its release runs (longbridge/nsh#1207), the Linux tray painting an SVG icon as a template (longbridge/nsh#1209), and shellInfo() for the installed app's version and NSH runtime (longbridge/nsh#1226). Also the Linux updater restarting from the pre-swap program path (longbridge/nsh#1269).
  # The 2026-11-10 nightly (c5214aa): what the app is developed and tested against.
  NSH_REF: c5214aaf4bbdf33bc1d59e9595e009b6aa54d702

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'tag'
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'push' && github.ref_type == 'tag'
      - name: Require published desktop CLI support before releasing clients
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: bun scripts/check-published-cli.ts
      - name: Check signing prerequisites
        if: github.event_name != 'pull_request'
        env:
          NSH_UPDATE_KEY: ${{ secrets.NSH_UPDATE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          for name in NSH_UPDATE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

  package:
    needs: preflight
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-24.04, asset: onlyone-linux-x86_64.tar.gz }
          - { target: windows, os: windows-latest, asset: onlyone-windows-x86_64.zip }
          - { target: macos, os: macos-15, asset: onlyone-macos-arm64.zip }
          - { target: ios, os: xcode-27, asset: onlyone-ios-unsigned.ipa }
          - { target: android, os: ubuntu-24.04, asset: onlyone-android.apk }
          - { target: web, os: ubuntu-24.04, asset: onlyone-web.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nsh
        with:
          ref: ${{ env.NSH_REF }}
          target: ${{ matrix.target }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          args=(--build "$GITHUB_RUN_NUMBER")
          [ "$GITHUB_REF_TYPE" != tag ] || args+=(--app-version "${GITHUB_REF_NAME#v}")
          # Settings › Version shows the release the app was built for.
          [ "$GITHUB_REF_TYPE" != tag ] || printf 'export const CLIENT_VERSION = "%s";\n' "${GITHUB_REF_NAME#v}" > app/version.ts
          out="$RUNNER_TEMP/out"
          mkdir -p assets
          if [ "$TARGET" = android ]; then
            if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
              keystore="$RUNNER_TEMP/release.jks"
              base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$keystore"
              args+=(--keystore "$keystore" --key-alias "$ANDROID_KEY_ALIAS")
            elif [ "$GITHUB_REF_TYPE" = tag ]; then
              # Each debug key differs, and Android refuses an update signed with another key.
              echo "::error::a release needs the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD"
              exit 1
            fi
          fi
          if [ "$TARGET" = web ]; then
            (cd app && NSH=nsh ./build-web.sh "${args[@]}")
            tar -czf "assets/$ASSET" -C app/dist/web/onlyone .
            ls -l assets
            exit 0
          fi
          (cd app && nsh package --target "$TARGET" -o "$out" "${args[@]}")
          case "$TARGET" in
            linux) mv "$out/OnlyOne.tar.gz" "assets/$ASSET"; mv "$out"/OnlyOne-*.tar.gz assets/ ;;
            windows) mv "$out/OnlyOne.zip" "assets/$ASSET"; mv "$out"/OnlyOne-*.zip assets/ ;;
            macos) ditto -c -k --keepParent "$out/OnlyOne.app" "assets/$ASSET"; mv "$out"/OnlyOne-*.tar.gz assets/ ;;
            ios)
              executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$out/OnlyOne.app/Info.plist")
              bash scripts/check-ios-sdk.sh "$out/OnlyOne.app/$executable"
              # Unsigned: sign it with your own Apple ID to install it (Sideloadly, AltStore).
              mkdir "$out/Payload" && mv "$out/OnlyOne.app" "$out/Payload/"
              (cd "$out" && zip -qry - Payload) > "assets/$ASSET" ;;
            android) mv "$out/OnlyOne.apk" "assets/$ASSET" ;;
          esac
          ls -l assets

      - name: Verify the macOS package
        if: matrix.target == 'macos'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          app="$RUNNER_TEMP/verify/OnlyOne.app"
          ditto -x -k "assets/$ASSET" "$RUNNER_TEMP/verify"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64
          test ! -e "$app/Contents/MacOS/onlyone-executor"
          codesign --verify --deep --strict "$app"

      # Reuse this ARM runner for Intel after packaging and testing the native app.
      - name: Set up Intel nsh
        if: matrix.target == 'macos'
        uses: ./.github/actions/setup-nsh
        with:
          ref: ${{ env.NSH_REF }}
          target: macos
          rust-target: x86_64-apple-darwin

      - name: Package and verify Intel macOS
        if: matrix.target == 'macos'
        run: |
          args=(--build "$GITHUB_RUN_NUMBER")
          [ "$GITHUB_REF_TYPE" != tag ] || args+=(--app-version "${GITHUB_REF_NAME#v}")
          out="$RUNNER_TEMP/out-x86_64"
          mkdir -p assets-intel
          # The Intel CLI runs through Rosetta and also names OTA archives macos-x86_64.
          (cd app && nsh package --target macos -o "$out" "${args[@]}")
          ditto -c -k --keepParent "$out/OnlyOne.app" assets-intel/onlyone-macos-x86_64.zip
          mv "$out"/OnlyOne-*-macos-x86_64.tar.gz assets-intel/
          app="$RUNNER_TEMP/verify-x86_64/OnlyOne.app"
          ditto -x -k assets-intel/onlyone-macos-x86_64.zip "$RUNNER_TEMP/verify-x86_64"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch x86_64
          test ! -e "$app/Contents/MacOS/onlyone-executor"
          codesign --verify --deep --strict "$app"

      - name: Upload Intel macOS package
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: onlyone-macos-x86_64.zip
          path: assets-intel/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: assets/
          if-no-files-found: error

  manifest:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/setup-nsh
        with:
          ref: ${{ env.NSH_REF }}
          target: linux
      - uses: actions/download-artifact@v4
        with:
          pattern: onlyone-*.*
          path: assets
          merge-multiple: true
      # Release file names are lowercase on every project (nsh names its OTA archives after the app, OnlyOne-<version>-...).
      - name: Lowercase asset names
        run: |
          cd assets
          for f in *; do l=$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]'); [ "$f" = "$l" ] || mv "$f" "$l"; done
          ls -l
      - name: Sign and verify the full-app update manifest
        env:
          NSH_UPDATE_KEY: ${{ secrets.NSH_UPDATE_KEY }}
        run: |
          version=$(jq -r .version app/nsh.json)
          [ "$GITHUB_REF_TYPE" != tag ] || version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' app/nsh.json > "$RUNNER_TEMP/nsh.json"
          mv "$RUNNER_TEMP/nsh.json" app/nsh.json
          key="$RUNNER_TEMP/update.secret"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$NSH_UPDATE_KEY" > "$key")
          # This workflow publishes native shells; CLI runtime releases belong to npm.yml.
          nsh update-manifest assets/onlyone-"$version"-*.tar.gz assets/onlyone-"$version"-*.zip \
            --entry app --out assets --key "$key" \
            --link "android=https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/onlyone-android.apk"
          bun scripts/check-app-release.ts assets
          (cd assets && sha256sum * > sha256sums)
      - uses: actions/upload-artifact@v4
        with:
          name: onlyone-release
          path: assets/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onlyone-release
          path: assets
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          # Published assets stay immutable; a failed draft can be inspected and removed before retrying.
          gh release create "$GITHUB_REF_NAME" * --verify-tag --generate-notes --draft --title "OnlyOne $GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
