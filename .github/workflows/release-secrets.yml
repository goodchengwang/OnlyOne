# Owner-run check of the repository secrets a `vX.Y.Z` tag needs to deploy that release's web client to the Worker.
# Getting them wrong is expensive: a tag builds and publishes every package before `deploy-web` runs. `gh secret list`
# returns names only, and agents are barred from `gh secret` (src/gates.ts), so this proves the four secrets exist and
# that the token, the Worker and the site really work — without cutting a release. It is the only trigger: nothing
# runs on a timer or on a push.
#
#   gh workflow run release-secrets.yml --ref <branch>
name: release secrets

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Require the four deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONLYONE_WORKER_NAME: ${{ secrets.ONLYONE_WORKER_NAME }}
          ONLYONE_DOMAIN: ${{ secrets.ONLYONE_DOMAIN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ONLYONE_WORKER_NAME ONLYONE_DOMAIN; do
            [ -n "${!name}" ] || { echo "::error::Missing repository secret: $name — set all four with scripts/set-release-secrets.sh"; missing=1; }
          done
          exit "$missing"

      - name: Verify the token reads the Worker and the site serves it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONLYONE_WORKER_NAME: ${{ secrets.ONLYONE_WORKER_NAME }}
          ONLYONE_DOMAIN: ${{ secrets.ONLYONE_DOMAIN }}
        run: |
          api=https://api.cloudflare.com/client/v4
          # -f makes a rejected token fail here instead of being grepped as "not active".
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/user/tokens/verify" | grep -q '"status":"active"' \
            || { echo "::error::CLOUDFLARE_API_TOKEN is not active"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ONLYONE_WORKER_NAME")
          [ "$code" = 200 ] || { echo "::error::the token cannot read Worker '$ONLYONE_WORKER_NAME' in account ${CLOUDFLARE_ACCOUNT_ID:0:6}… (HTTP $code)"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://$ONLYONE_DOMAIN/")
          [ "$code" = 200 ] || { echo "::error::https://$ONLYONE_DOMAIN/ answers HTTP $code, not 200"; exit 1; }
          # 401 only while the Worker still has its secrets and data; a fresh version without them answers 500.
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://$ONLYONE_DOMAIN/api/status")
          [ "$code" = 401 ] || { echo "::error::https://$ONLYONE_DOMAIN/api/status answers HTTP $code, not 401"; exit 1; }
          echo "The four secrets are set; the token reads Worker '$ONLYONE_WORKER_NAME' and https://$ONLYONE_DOMAIN serves it."
